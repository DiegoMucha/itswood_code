<!DOCTYPE html>
<html lang="es-PE">
<head>

  <meta name="author" content="Priora">
  <meta name="theme-color" content="#F3EBDF">

  <meta property="og:title" content="Priora | Tu negocio atiende a todos, sin que tú te satures">

<body>

<a href="#contenido" class="skip-link" data-text="saltarContenido"></a>

<!-- ===================== NAVBAR ===================== -->
<header class="navbar-wrap">
  <nav class="navbar vidrio" id="navbar" aria-label="Navegación principal">
    <a href="#inicio" class="logo" data-aria-label="nav.inicioAria">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="15" fill="#FFFFFF"/>
        <path d="M7 19c4-7 10-9 18-6" fill="none" stroke="#3E2F25" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="logo-name" data-text="marca"></span>
    </a>

    <button class="hamburger" id="hamburger" type="button" aria-expanded="false" aria-controls="nav-menu" data-aria-label="nav.menuAria">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <div class="nav-menu" id="nav-menu">
      <ul class="nav-links" data-list="nav.links">
        <template><li><a class="nav-link" data-item-href="href" data-item="texto"></a></li></template>
      </ul>
      <a href="#contacto" class="btn btn-principal btn-sm" data-app-path="/app" data-text="nav.cta"></a>
    </div>
  </nav>
</header>

<main id="contenido" tabindex="-1">

  <!-- ===================== HERO ===================== -->
  <section class="hero" id="inicio" aria-labelledby="hero-titulo">
    <div class="hero-texto">
      <p class="etiqueta etiqueta-clara" data-text="hero.etiqueta"></p>
      <h1 id="hero-titulo" data-text="hero.titulo"></h1>
      <p class="hero-subtitulo" data-text="hero.subtitulo"></p>
      <div class="hero-botones">
        <a href="#contacto" class="btn btn-principal" data-app-path="/app" data-text="hero.ctaPrincipal"></a>
        <a href="#demo" class="btn btn-vidrio" data-app-path="/app/mermin" data-requiere-app data-text="hero.ctaSecundario"></a>
      </div>
    </div>

    <!-- Curva de luz decorativa (SVG en línea): dos halos desenfocados + un trazo fino nítido.
         Con aceleración gráfica, hero-scene.js la cambia por la escena de Spline, cuya URL vive SOLO en data-spline-url -->
    <div class="hero-visual" data-spline-url="https://my.spline.design/claritystream-Txg1N81Wzit6iC1CdjTIFz36/" aria-hidden="true">
      <svg class="luz luz-halo-ancho" viewBox="0 0 1440 900" preserveAspectRatio="none" focusable="false">
        <defs>
          <!-- Se desvanece en los dos extremos de la curva -->
          <linearGradient id="luz-durazno" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#EBA98A" stop-opacity="0"/>
            <stop offset="0.3" stop-color="#EBA98A"/>
            <stop offset="0.75" stop-color="#EBA98A"/>
            <stop offset="1" stop-color="#EBA98A" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="luz-crema" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFF6EA" stop-opacity="0"/>
            <stop offset="0.3" stop-color="#FFF6EA" stop-opacity="0.85"/>
            <stop offset="0.55" stop-color="#FFF6EA"/>
            <stop offset="0.8" stop-color="#FFF6EA" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#FFF6EA" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path stroke="url(#luz-durazno)" d="M-20 470 C 280 500, 470 740, 700 740 C 960 740, 1180 440, 1460 170"/>
      </svg>
      <svg class="luz luz-halo" viewBox="0 0 1440 900" preserveAspectRatio="none" focusable="false">
        <path stroke="url(#luz-crema)" d="M-20 470 C 280 500, 470 740, 700 740 C 960 740, 1180 440, 1460 170"/>
      </svg>
      <svg class="luz luz-trazo" viewBox="0 0 1440 900" preserveAspectRatio="none" focusable="false">
        <path stroke="url(#luz-crema)" d="M-20 470 C 280 500, 470 740, 700 740 C 960 740, 1180 440, 1460 170"/>
      </svg>
    </div>
  </section>

  <!-- ===================== DESTACADOS (bajo el hero) ===================== -->
  <section class="destacados" aria-label="Priora en breve">
    <article class="tarjeta vidrio">
      <p class="tarjeta-cifra" data-text="destacados.cifra.valor"></p>
      <p data-text="destacados.cifra.texto"></p>
    </article>
    <article class="tarjeta vidrio">
      <h2 class="tarjeta-titulo" data-text="destacados.caracteristica.titulo"></h2>
      <p data-text="destacados.caracteristica.texto"></p>
    </article>
    <article class="tarjeta vidrio">
      <h2 class="tarjeta-titulo" data-text="destacados.voz.titulo"></h2>
      <p data-text="destacados.voz.texto"></p>
      <p class="tarjeta-rotulo" data-text="destacados.voz.rotulo"></p>
    </article>
  </section>

  <!-- ===================== EL PROBLEMA ===================== -->
  <section class="seccion" id="problema" aria-labelledby="problema-titulo">
    <div class="contenedor">
      <p class="etiqueta" data-text="problema.etiqueta"></p>
      <h2 id="problema-titulo" data-text="problema.titulo"></h2>
      <p class="seccion-texto" data-text="problema.texto"></p>
      <ul class="lista-puntos" data-list="problema.puntos">
        <template><li data-item="."></li></template>
      </ul>
    </div>
  </section>

  <!-- ===================== CÓMO FUNCIONA ===================== -->
  <section class="seccion" id="como-funciona" aria-labelledby="como-titulo">
    <div class="contenedor">
      <p class="etiqueta" data-text="comoFunciona.etiqueta"></p>
      <h2 id="como-titulo" data-text="comoFunciona.titulo"></h2>
      <ol class="pasos" data-list="comoFunciona.pasos">
        <template>
          <li class="paso">
            <span class="paso-numero" data-item="numero" aria-hidden="true"></span>
            <h3 data-item="titulo"></h3>
            <p data-item="texto"></p>
          </li>
        </template>
      </ol>
    </div>
  </section>

  <!-- ===================== QUÉ INCLUYE ===================== -->
  <section class="seccion" id="que-incluye" aria-labelledby="incluye-titulo">
    <div class="contenedor">
      <p class="etiqueta" data-text="incluye.etiqueta"></p>
      <h2 id="incluye-titulo" data-text="incluye.titulo"></h2>
      <ul class="rejilla-incluye" data-list="incluye.items">
        <template>
          <li class="tarjeta vidrio">
            <h3 data-item="titulo"></h3>
            <p data-item="texto"></p>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <!-- ===================== QUÉ LO HACE DISTINTO ===================== -->
  <section class="seccion" id="distinto" aria-labelledby="distinto-titulo">
    <div class="contenedor">
      <p class="etiqueta" data-text="distinto.etiqueta"></p>
      <h2 id="distinto-titulo" data-text="distinto.titulo"></h2>
      <ul class="rejilla-distinto" data-list="distinto.tarjetas">
        <template>
          <li class="tarjeta vidrio">
            <h3 data-item="titulo"></h3>

  <!-- ===================== CASO REAL: ITS WOOD ===================== -->
  <section class="seccion" id="caso-its-wood" aria-labelledby="caso-titulo">
    <div class="contenedor">
      <p class="etiqueta" data-text="caso.etiqueta"></p>
      <h2 id="caso-titulo" data-text="caso.titulo"></h2>
      <p class="seccion-texto" data-text="caso.bajada"></p>
      <dl class="caso-bloques" data-list="caso.bloques">
        <template>
          <div class="caso-bloque">
            <dt data-item="titulo"></dt>
            <dd data-item="texto"></dd>
          </div>
        </template>
      </dl>
      <div class="caso-diagnostico">
        <h3 class="caso-diagnostico-titulo" data-text="caso.diagnostico.titulo"></h3>
        <ul class="diagnostico-puntos" data-list="caso.diagnostico.puntos">
          <template><li data-item="."></li></template>
        </ul>
      </div>
      <p class="caso-nota" data-text="caso.nota"></p>
    </div>
  </section>

  <!-- ===================== DEMO ===================== -->
  <section class="seccion" id="demo" aria-labelledby="demo-titulo" data-requiere-app>
    <div class="contenedor">
      <p class="etiqueta" data-text="demo.etiqueta"></p>
      <h2 id="demo-titulo" data-text="demo.titulo"></h2>
      <p class="seccion-texto" data-text="demo.texto"></p>

      <a class="btn btn-principal" href="#demo" data-app-path="/app/mermin" data-text="demo.cta"></a>

  </section>

  <!-- ===================== CIERRE ===================== -->
  <section class="seccion" id="contacto" aria-labelledby="cierre-titulo">
    <div class="contenedor">
      <h2 id="cierre-titulo" data-text="cierre.titulo"></h2>
      <p class="seccion-texto" data-text="cierre.texto"></p>
      <div class="cierre-botones">
        <a class="btn btn-principal" href="#contacto" data-app-path="/app" data-text="cierre.cta"></a>
        <a class="btn btn-vidrio" data-email data-text="cierre.escribenos"></a>

    </div>
  </section>

</main>
